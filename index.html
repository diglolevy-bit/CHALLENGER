<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>CHALLENGER</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      text-align: center;
    }

    header {
      background: black;
      padding: 20px;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .banner {
      padding: 60px;
      background: url('https://via.placeholder.com/1200x400') center/cover;
    }

    .banner h1 {
      font-size: 50px;
    }

    .produtos {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      padding: 20px;
    }

    .produto {
      background: #1a1a1a;
      margin: 15px;
      padding: 20px;
      border-radius: 10px;
      width: 250px;
    }

    img {
      width: 100%;
      border-radius: 10px;
    }

    button {
      margin-top: 10px;
      background: red;
      color: white;
      padding: 10px;
      border: none;
      cursor: pointer;
      width: 100%;
    }

    button:hover {
      background: darkred;
    }
  </style>
</head>

<body>

<header>CHALLENGER</header>

<div class="banner">
  <h1>Push Your Limits</h1>
</div>

<section class="produtos">

  <div class="produto">
    <img src="https://via.placeholder.com/250">
    <h2>T-shirt Challenger</h2>
    <p>20€</p>
    <a href="LINK_DE_PAGAMENTO">
      <button>Comprar</button>
    </a>
  </div>

  <div class="produto">
    <img src="https://via.placeholder.com/250">
    <h2>Calção Desportivo</h2>
    <p>25€</p>
    <a href="LINK_DE_PAGAMENTO">
      <button>Comprar</button>
    </a>
  </div>

</section>

</body>
</html>
